{{- if eq .Values.postgresql.mode "managed" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "switch.fullname" . }}-postgresql
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "postgresql") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "switch.fullname" . }}-postgresql-hl
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "postgresql") | nindent 4 }}
{{- end }}
