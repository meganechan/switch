{{- if eq .Values.postgresql.mode "managed" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "switch.fullname" . }}-postgresql-init
  labels:
    {{- include "switch.labels" . | nindent 4 }}
data:
  02-create-mattermost-db.sh: |
    #!/bin/bash
    psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='mattermost'" | grep -q 1 || \
      psql -U postgres -c "CREATE DATABASE mattermost;"
{{- end }}
