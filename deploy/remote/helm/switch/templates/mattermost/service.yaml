{{- if .Values.mattermost.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "switch.mattermostHost" . }}
  labels:
    {{- include "switch.labels" . | nindent 4 }}
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "mattermost") | nindent 4 }}
spec:
  type: {{ .Values.mattermost.service.type }}
  ports:
    - port: {{ .Values.mattermost.service.port }}
      targetPort: 8065
      protocol: TCP
      name: http
  selector:
    {{- include "switch.selectorLabels" (dict "Release" .Release "component" "mattermost") | nindent 4 }}
{{- end }}
