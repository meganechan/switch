name: CodeQL

# Static analysis for the two languages that make up the product: the Python
# control plane and the TypeScript in the console and gateway. Results land in
# the Security tab as code scanning alerts.
#
# Report-only. It runs on PRs and on main, and on a weekly schedule so a newly
# published query finds existing code rather than waiting for the next PR to
# touch it. It does NOT gate merge — pr-ci.yml is the gate.
#
# Fork safety: `pull_request` (never `pull_request_target`), so a fork PR gets a
# read-only token and no secrets. `security-events: write` is granted per job
# because uploading SARIF requires it; on a fork PR GitHub withholds it and the
# upload is skipped rather than failing the run.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC — off the hour to avoid the scheduling stampede.
    - cron: '17 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # No build step: both languages are analysed in `none` build mode, so
      # nothing from the PR is executed on the runner.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: '/language:${{ matrix.language }}'
