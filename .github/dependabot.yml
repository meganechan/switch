version: 2

# Keeps dependencies patched across the three code trees plus the GitHub Actions
# we pin in workflows. Dependabot opens a PR per outdated (or vulnerable)
# dependency; those PRs run through PR CI (pr-ci.yml) like any other. Grouped
# where sensible to keep PR volume manageable.
#
# `cooldown` holds off on newly published versions for a week — a just-released
# (or freshly compromised) package version is the highest-risk moment, so we let
# it settle before proposing the bump. Security updates for known CVEs are NOT
# subject to cooldown, so real fixes still land promptly.
updates:
  # Backend Python package (uv).
  - package-ecosystem: uv
    directory: /core
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      python-deps:
        patterns:
          - '*'

  # Switchdash desktop app (pnpm workspace).
  - package-ecosystem: npm
    directory: /dash
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      dash-deps:
        patterns:
          - '*'

  # Operator dashboard UI (npm).
  - package-ecosystem: npm
    directory: /gateway
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      gateway-deps:
        patterns:
          - '*'

  # Versions of the actions pinned in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
