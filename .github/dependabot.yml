# Dependabot covers the ecosystems Renovate does not.
#
# renovate.json5 scopes self-hosted Renovate to dockerfile, docker-compose and
# github-actions, and Socket watches npm/PyPI for malware and CVEs. Neither
# opens routine version PRs for the application dependencies, which left the
# npm and Python trees with alerts but nothing proposing the fix.
#
# Security updates only: `open-pull-requests-limit: 0` disables version-bump
# PRs while leaving Dependabot free to open security ones, so this does not
# duplicate Renovate's remit or bury reviewers.
version: 2
updates:
  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
